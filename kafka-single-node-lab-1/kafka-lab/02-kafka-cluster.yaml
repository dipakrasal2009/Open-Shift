# Single-node KRaft Kafka cluster - sized for 1 worker (~15Gi allocatable)
#
# Rewritten for AMQ Streams 3.2.0 / Strimzi 0.46+, which:
#   - removed ZooKeeper support entirely (KRaft-only now)
#   - only supports Kafka 4.1.0 / 4.2.0 (not 3.7.0)
#   - moved replicas/storage/resources OUT of the Kafka CR and into a
#     separate KafkaNodePool CR
#
# This node runs BOTH roles (controller + broker) since we only have one
# worker to schedule onto - a real KRaft cluster normally separates them.
#
# Same single-node reasoning as before, now expressed via the NodePool:
#   replicas: 1                        -> only one schedulable worker exists
#   default.replication.factor: 1      -> RF>1 is permanently under-replicated with 1 node
#   min.insync.replicas: 1             -> min.insync=2 + acks=all on 1 node hangs forever
#   storage: ephemeral                 -> skip PVC/StorageClass complexity while learning
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: dev-kafka
spec:
  replicas: 1
  roles:
  - controller
  - broker
  storage:
    type: ephemeral
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 1536Mi }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: dev-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef: { name: kafka-metrics, key: kafka-metrics-config.yml }
  entityOperator:
    topicOperator: {}
    userOperator: {}
