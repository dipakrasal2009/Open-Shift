# TC-05: multi-tenancy hygiene - quota + limits prove tenant isolation
apiVersion: v1
kind: Namespace
metadata: { name: tenant-a }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: tenant-quota, namespace: tenant-a }
spec:
  hard:
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata: { name: tenant-limits, namespace: tenant-a }
spec:
  limits:
  - type: Container
    default: { memory: 256Mi }
    defaultRequest: { memory: 128Mi }
