# Controlled leaker: ~10Mi/min. Limit intentionally set ABOVE node capacity
# is not possible per-container, so we omit the limit to force NODE pressure
# (LimitRange default is overridden here explicitly to allow the leak to grow).
apiVersion: apps/v1
kind: Deployment
metadata: { name: leaker, namespace: tenant-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: leaker } }
  template:
    metadata: { labels: { app: leaker } }
    spec:
      containers:
      - name: leaker
        image: registry.access.redhat.com/ubi9/python-311
        resources:
          requests: { memory: 128Mi }
          limits: { memory: 3Gi }   # high enough to reach node pressure first
        command: ["python3","-u","-c"]
        args:
        - |
          import time
          chunks=[]
          while True:
              chunks.append(bytearray(10*1024*1024))  # 10Mi
              print("allocated", len(chunks)*10, "Mi", flush=True)
              time.sleep(60)
